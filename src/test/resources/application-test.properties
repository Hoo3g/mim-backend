# Server
server.port=8080

# PostgreSQL for CI/local test profile
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/mim_db}
spring.datasource.username=${TEST_DB_USERNAME:mim_user}
spring.datasource.password=${TEST_DB_PASSWORD:mim_password_test}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Multipart upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT
jwt.secret=test-secret-key-change-me-please-32chars
jwt.accessTokenExpiration=3600000
jwt.refreshTokenExpiration=2592000000

# Cookie (test)
auth.refresh-cookie.name=refresh_token
auth.refresh-cookie.path=/api/v1/auth
auth.refresh-cookie.same-site=Lax
auth.refresh-cookie.secure=false

# OAuth
google.oauth.client-id=test-client-id

# CORS
app.cors.allowed-origins=http://localhost:4200,http://localhost:4000

# Redis (no network use during context load)
app.redis.host=localhost
app.redis.port=6379
app.redis.password=test-redis-password
app.redis.max-memory=256mb

# MinIO (no network use during context load)
app.minio.endpoint=http://localhost:9000
app.minio.access-key=test-access-key
app.minio.secret-key=test-secret-key
app.minio.bucket=test-bucket
