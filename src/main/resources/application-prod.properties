# Server
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,caches,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# Multipart upload (PDF)
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:20MB}

# JWT
jwt.secret=${JWT_SECRET}
jwt.accessTokenExpiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refreshTokenExpiration=${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}

# Refresh cookie (prod)
auth.refresh-cookie.name=${AUTH_REFRESH_COOKIE_NAME:refresh_token}
auth.refresh-cookie.path=${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
auth.refresh-cookie.same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
auth.refresh-cookie.secure=${AUTH_REFRESH_COOKIE_SECURE:true}

# Google OAuth
app.auth.google-login.enabled=${APP_AUTH_GOOGLE_LOGIN_ENABLED:false}
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Redis (Custom namespace)
app.redis.host=${APP_REDIS_HOST}
app.redis.port=${APP_REDIS_PORT:6379}
app.redis.password=${APP_REDIS_PASSWORD}
app.redis.max-memory=${APP_REDIS_MAX_MEMORY:256mb}

# MinIO (Custom namespace)
app.minio.endpoint=${APP_MINIO_ENDPOINT}
app.minio.access-key=${APP_MINIO_ACCESS_KEY}
app.minio.secret-key=${APP_MINIO_SECRET_KEY}
app.minio.bucket=${APP_MINIO_BUCKET}

# SMTP (used for verification email)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:10000}

# Email verification
app.notification.email-verification.enabled=${APP_NOTIFICATION_EMAIL_VERIFICATION_ENABLED:false}
app.notification.email-verification.from=${APP_NOTIFICATION_EMAIL_VERIFICATION_FROM:}
app.notification.email-verification.sender-name=${APP_NOTIFICATION_EMAIL_VERIFICATION_SENDER_NAME:MIM HUS}
app.notification.email-verification.subject-prefix=${APP_NOTIFICATION_EMAIL_VERIFICATION_SUBJECT_PREFIX:[MIM Verify Email]}
app.notification.email-verification.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:4200}
app.notification.email-verification.token-ttl-minutes=${APP_NOTIFICATION_EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:1440}
