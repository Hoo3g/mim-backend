name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mim_db
          POSTGRES_USER: mim_user
          POSTGRES_PASSWORD: mim_password_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mim_user -d mim_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/mim_db
      TEST_DB_USERNAME: mim_user
      TEST_DB_PASSWORD: mim_password_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit/integration tests
        run: mvn -B test

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar (skip tests)
        run: mvn -B -DskipTests package
